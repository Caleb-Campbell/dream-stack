# wrangler.toml (For Cloudflare Workers Deployment)

# Defines the workers to be deployed via `wrangler deploy`

# Worker: example-processor
[[workers]]
name = "example-processor" # The name of the worker
main = "workers/example-processor/index.ts" # Entry point for the worker code
compatibility_date = "2024-04-05" # Worker-specific compatibility date
# Add bindings here if needed, e.g.:
# kv_namespaces = [
#   { binding = "MY_KV_NAMESPACE", id = "your_kv_namespace_id" }
# ]
# r2_buckets = [
#   { binding = "MY_BUCKET", bucket_name = "your-bucket-name" }
# ]
# queues.producers = [
#   { queue = "my-queue", binding = "MY_QUEUE" }
# ]
# queues.consumers = [
#   { queue = "my-queue" } # Consumed within the worker code via queue() handler
# ]
# durable_object_namespaces = [
#  { binding = "MY_DURABLE_OBJECT", class_name = "MyDurableObject" }
# ]
# services = [
#  { binding = "MY_SERVICE", service = "other-worker-name" }
# ]

# Add definitions for other workers below using the [[workers]] table format
# [[workers]]
# name = "another-worker"
# main = "workers/another-worker/index.ts"
# compatibility_date = "2024-04-05"

# Note: Top-level 'name' and 'compatibility_date' were removed to avoid conflicts
# with Cloudflare Pages builds interpreting this file.
# Worker-specific configuration should be within each [[workers]] block.

# Configuration for local development using `wrangler dev` can still be added globally if needed
# [dev]
# ip = "127.0.0.1"
# port = 8787
# local_protocol = "http"
# upstream_protocol = "https" 